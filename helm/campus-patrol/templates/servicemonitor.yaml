{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "patrol.fullname" . }}-backend
  labels:
    {{- include "patrol.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "patrol.selector" (dict "ctx" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
