# EKS with ingress-nginx, metrics-server and kube-prometheus-stack installed
# (see scripts/install-cluster-addons.sh).
ingress:
  enabled: true
  host: ""   # match the load balancer hostname directly
hpa:
  enabled: true
monitoring:
  serviceMonitor:
    enabled: true
  alerts:
    enabled: true
  dashboard:
    enabled: true

postgres:
  # EKS ships a gp2 StorageClass but does not mark it as the cluster default,
  # so the volume claim must name it explicitly.
  storageClassName: gp2
