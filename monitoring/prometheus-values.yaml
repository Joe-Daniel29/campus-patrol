# Values for the kube-prometheus-stack chart.
grafana:
  enabled: true
  # The admin password is generated by the chart; read it with:
  #   kubectl get secret -n monitoring kube-prometheus-stack-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  sidecar:
    dashboards:
      enabled: true
      # Pick up dashboard ConfigMaps from the campus-patrol namespace too.
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors and PrometheusRules from any namespace, not only
    # those labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
