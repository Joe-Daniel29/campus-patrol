name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run pytest
        run: pytest -v
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  image:
    name: image (${{ matrix.image }})
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, simulator]
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository path.
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/campus-patrol-${{ matrix.image }}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" ./${{ matrix.image }}

      # Fails the job on fixable HIGH/CRITICAL vulnerabilities, before anything is pushed.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA so every running image traces back to a commit.
      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  # Runs only when the repository variable DEPLOY_ENABLED is "true", i.e. while an EKS
  # cluster exists. Keeps the pipeline green (and AWS costs at zero) otherwise.
  deploy:
    needs: image
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'campus-patrol-eks' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
      - name: Deploy with Helm
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install campus-patrol ./helm/campus-patrol \
            --namespace campus-patrol --create-namespace \
            -f helm/campus-patrol/values-eks.yaml \
            --set backend.image="ghcr.io/${OWNER}/campus-patrol-backend" \
            --set backend.tag="${GITHUB_SHA}" \
            --set frontend.image="ghcr.io/${OWNER}/campus-patrol-frontend" \
            --set frontend.tag="${GITHUB_SHA}" \
            --set simulator.image="ghcr.io/${OWNER}/campus-patrol-simulator" \
            --set simulator.tag="${GITHUB_SHA}" \
            --wait --timeout 5m
