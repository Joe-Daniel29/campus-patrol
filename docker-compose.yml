services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patrol
      POSTGRES_USER: patrol
      POSTGRES_PASSWORD: patrol
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrol -d patrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://patrol:patrol@postgres:5432/patrol
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"

  # Simulated rovers. Start with: docker compose --profile sim up --build
  simulator:
    build: ./simulator
    profiles: ["sim"]
    environment:
      API_URL: http://backend:8000
      ROVERS: "8"
      INTERVAL: "2"
    depends_on:
      - backend

volumes:
  postgres-data:
