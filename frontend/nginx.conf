server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Compose path: the browser only talks to this host, nginx forwards the API.
    # On Kubernetes the Ingress routes /api straight to the backend Service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
